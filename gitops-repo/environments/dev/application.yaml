apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: dev-my-app
  namespace: argocd
spec:
  project: default
  sources:
   - repoURL: https://github.com/YulianBortsov/DevOpsProject.git
     targetRevision: dev
     path: app-repo
     helm:
       valueFiles:
         - $values/gitops-repo/environments/dev/values.yaml
   - repoURL: https://github.com/YulianBortsov/DevOpsProject.git
     targetRevision: dev
     path: gitops-repo
     ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: dev-my-app
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
        - CreateNamespace=true

    