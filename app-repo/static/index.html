<!DOCTYPE html>
<html>
<head>
    <title>Task Recorder</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <h1 class="main-heading">Task Managerrrrrr</h1>
        <p class="subtext">Stay organized with simplicity</p>
    </header>

    <main>
        <section class="form-section">
            <h2>Create Item</h2>
            <form id="createItemForm">
                <label for="name">Name:</label>
                <input type="text" id="name" name="name" required>
                <label for="description">Description:</label>
                <input type="text" id="description" name="description">
                <button type="submit">Create</button>
            </form>
            <p id="errorMessage" style="color: red; display: none;"></p>
        </section>

        <section class="form-section" id="editSection" style="display:none;">
            <h2>Edit Item</h2>
            <form id="editItemForm">
                <input type="hidden" id="editItemId">
                <label for="editName">Name:</label>
                <input type="text" id="editName" name="editName" required>
                <label for="editDescription">Description:</label>
                <input type="text" id="editDescription" name="editDescription">
                <button type="submit">Save Changes</button>
            </form>
        </section>

        <section class="items-section">
            <h2>Items List</h2>
            <button class="load-items" onclick="loadItems()">Load Items</button>
            <ul id="itemsList"></ul>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
