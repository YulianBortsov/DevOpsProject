apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.env }}-{{ .Release.Name }}-frontend
  labels:
    app: {{ .Values.env }}-{{ .Release.Name }}-frontend
spec:
  type: {{ .Values.frontend.service.type }}
  ports:
    - port: {{ .Values.frontend.service.port }}
      targetPort: 80
  selector:
    app: {{ .Values.env }}-{{ .Release.Name }}-frontend
