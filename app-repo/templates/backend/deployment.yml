apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.env }}-{{ .Release.Name }}-backend
  labels:
    app: {{ .Values.env }}-{{ .Release.Name }}-backend
spec:
  replicas: {{ .Values.backend.replicaCount }}
  selector:
    matchLabels:
      app: {{ .Values.env }}-{{ .Release.Name }}-backend
  template:
    metadata:
      labels:
        app: {{ .Values.env }}-{{ .Release.Name }}-backend
    spec:
      nodeSelector:
        karpenter.sh/nodepool: default
      containers:
        - name: backend
          image: {{ .Values.backend.image.repository }}:{{ .Values.backend.image.backTag }}
          imagePullPolicy: {{ .Values.backend.image.pullPolicy }}  
          ports:
            - containerPort: 5000
          livenessProbe:
            {{- toYaml .Values.backend.livenessProbe | nindent 12 }}
          readinessProbe:
            {{- toYaml .Values.backend.readinessProbe | nindent 12 }}
          env:
          {{- with .Values.rds }}
            - name: RDS_HOSTNAME
              valueFrom:
                secretKeyRef:
                  name: {{ .secretName }}
                  key: {{ .secretKeys.host }}
            - name: RDS_PORT
              valueFrom:
                secretKeyRef:
                  name: {{ .secretName }}
                  key: {{ .secretKeys.port }}
            - name: RDS_DB_NAME
              valueFrom:
                secretKeyRef:
                  name: {{ .secretName }}
                  key: {{ .secretKeys.dbname }}
            - name: RDS_USERNAME
              valueFrom:
                secretKeyRef:
                  name: {{ .secretName }}
                  key: {{ .secretKeys.username }}
            - name: RDS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .secretName }}
                  key: {{ .secretKeys.password }}
          {{- end }}

