name: Build new frontend image and Deploy

on:
  push:
    branches:
      - dev
      - staging
      - production
    paths:
      - 'app-repo/static/**'
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v2
      - name: Get branch name
        id: branch-name
        run: echo "BRANCH_NAME=${GITHUB_REF#refs/heads/}" >> $GITHUB_OUTPUT
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v1
      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: Build and Tag
        run: |
          docker build -t ${{ secrets.DOCKER_USERNAME }}/${{ vars.FRONTEND_IMAGE }}:${{ github.sha }} \
          -t ${{ secrets.DOCKER_USERNAME }}/${{ vars.FRONTEND_IMAGE }}:${{ steps.branch-name.outputs.BRANCH_NAME }}-latest \
          -f ./app-repo/static/Dockerfile ./app-repo/static
      - name: Push Image
        run: |
          docker push ${{ secrets.DOCKER_USERNAME }}/${{ vars.FRONTEND_IMAGE }}:${{ github.sha }}
          docker push ${{ secrets.DOCKER_USERNAME }}/${{ vars.FRONTEND_IMAGE }}:${{ steps.branch-name.outputs.BRANCH_NAME }}-latest
      - name: Change values file in gitops repo
        run: |
          sed -i "s/frontTag: .*/frontTag: ${{ github.sha }}/" ./gitops-repo/environments/${{ steps.branch-name.outputs.BRANCH_NAME }}/values.yaml
      - name: Commit and push changes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global user.email "actions@github.com"
          git config --global user.name "GitHub Actions"
          git add ./gitops-repo/environments/${{ steps.branch-name.outputs.BRANCH_NAME }}/values.yaml
          git commit -m "Update frontend image tag to ${{ github.sha }} for ${{ steps.branch-name.outputs.BRANCH_NAME }} environment"
          git push